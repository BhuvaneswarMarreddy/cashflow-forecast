# Deploy pipeline (OPS-CD-001) — push to main, it ships.
#
# Replaces running `npm run deploy` from a laptop. The same gate runs every time:
# deploy cannot start until validate.yml passes in full, and validate.yml is reused
# here rather than copied so the two can never drift.
#
# ONE-TIME SETUP — two minutes, see docs/ci/DEPLOY-PIPELINE.md
#   1. firebase login:ci          → prints a token
#   2. GitHub → Settings → Secrets → Actions → new secret FIREBASE_TOKEN
#
# WHAT SHIPS
#   functions:api  — aiChat, aiDecision, parseReceipt, homeSnapshot, reviewQueue,
#     resolveReview, flowSnapshot, flowNodeDetail, importCsv, applyDecision, undoDecision
#   hosting        — the Next.js app and its SSR function
#
# WHAT DELIBERATELY DOES NOT
#   firestore.rules — a bad ruleset locks you out of your own financial data and the
#     rollback is a console visit, not a git revert. The 180-test emulator suite runs
#     in validate.yml so drift is caught; publishing stays a human act.
#     Change your mind: add `,firestore:rules` to --only below.
#   functions:sync  — the Python codebase holding your bank sync credentials. Never
#     deployed from CI; this is not the change that should prove it works.
name: deploy

on:
  push:
    branches: [main]
    # Docs don't ship. Skips a ~9 minute run — worth it on a private repo's
    # 2,000 free Actions minutes a month.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. Two overlapping `firebase deploy` runs against one project is
# how a half-published function meets a half-published hosting release. No
# cancel-in-progress: a deploy that has started must be allowed to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The gate. Reused, not duplicated — and called WITHOUT `secrets: inherit`, so the
  # validation job still has no path to production.
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    name: deploy
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # issues: write is for exactly one thing: the hand-deploy alert below.
    permissions:
      contents: read
      issues: write
      actions: read   # the hand-deploy alert looks up the last successful deploy

    steps:
      - uses: actions/checkout@v4
        with:
          # The hand-deploy alert diffs against the commit main was at before this push.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # nodejs24 is what ssrmarreddycashflow runs. The web-frameworks integration
          # picks the SSR runtime from the DEPLOYING machine's Node major, so this pin
          # is what stops a laptop on a different version from silently moving it.
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Deploy functions and hosting
        env:
          # The CLI reads this itself — nothing to write to disk, nothing to clean up.
          # It also prints a deprecation notice: FIREBASE_TOKEN is going away in favour
          # of GOOGLE_APPLICATION_CREDENTIALS. Still works; the upgrade path is a
          # datastore-viewer-style service account, documented in DEPLOY-PIPELINE.md.
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          # hosting.source = "." with frameworksBackend makes this a web-framework
          # deploy, which is still behind an experiment flag. Enabled once on this
          # laptop years ago and stored in ~/.config/configstore — invisible locally,
          # absent on every fresh runner. Same root cause as the rules-emulator fix.
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is not set. Run 'firebase login:ci' and add it. See docs/ci/DEPLOY-PIPELINE.md."
            exit 1
          fi
          npx firebase-tools deploy \
            --only functions:api,hosting \
            --project marreddy-cashflow \
            --non-interactive \
            --force

      # firestore:rules and functions:sync stay a human act (see the header). What was
      # missing was anyone being TOLD: #118 shipped a client calling a sync callable
      # that was never hand-deployed, and delete-account stayed broken until someone
      # noticed. Open an issue whenever main carries either one.
      #
      # The baseline is the commit the last SUCCESSFUL deploy shipped, not the previous
      # push. A push whose run failed or was cancelled never reaches this step (8 were
      # cancelled on 2026-08-23 alone), and diffing only before..after would lose its
      # rules change for good. A run that deployed but then failed its smoke test keeps
      # the old baseline, so the next run would alert again: it comments on the open
      # issue instead of opening a second one.
      - name: Alert when a change needs a hand deploy
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          BASE=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha' || true)
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::warning::No earlier successful deploy found in history; comparing with the previous commit only."
            BASE="$BEFORE"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::warning::No baseline commit to compare; cannot tell whether rules or sync changed."
            exit 0
          fi
          echo "Comparing ${BASE::7}..${GITHUB_SHA::7}"
          CHANGED=$(git diff --name-only "$BASE" "$GITHUB_SHA" -- firestore.rules functions-sync/)
          if [ -z "$CHANGED" ]; then
            echo "Nothing here needs a hand deploy."
            exit 0
          fi
          ONLY=""
          echo "$CHANGED" | grep -q '^firestore.rules$' && ONLY="firestore:rules"
          echo "$CHANGED" | grep -q '^functions-sync/' && ONLY="${ONLY:+$ONLY,}functions:sync"
          BODY="$(printf '%s\n' \
            "Main is at ${GITHUB_SHA::7}. CI deployed \`functions:api\` + hosting, but these changed since the last successful deploy (${BASE::7}) and CI deliberately never deploys them:" \
            '' '```' "$CHANGED" '```' '' \
            'From a checkout of main (firebase deploy ships the LOCAL tree):' \
            '' '```' 'git checkout main && git pull --ff-only' \
            "npx firebase-tools deploy --only $ONLY --project marreddy-cashflow" '```' '' \
            'Close this issue once it is deployed.')"
          OPEN=$(gh issue list --state open --search 'in:title "Hand deploy needed"' --json number -q '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$BODY"
            echo "::warning::Hand deploy still needed: $ONLY. Commented on #$OPEN."
          else
            gh issue create --label P1 --label type:infra --label area:ops \
              --title "Hand deploy needed: $ONLY (${GITHUB_SHA::7})" --body "$BODY"
            echo "::warning::Hand deploy needed: $ONLY. An issue was opened."
          fi

      # Deploying is not the same as working. Hit the real site and go red if what just
      # shipped does not serve — otherwise a green tick only means "uploaded".
      - name: Smoke test the live site
        run: |
          FAILED=0
          for path in / /dashboard /flow /accounts /forecast; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://marreddy-cashflow.web.app$path")
            echo "  $path -> $CODE"
            [ "$CODE" = "200" ] || FAILED=1
          done
          # The AI proxy routes were removed for being unauthenticated (SEC-001). If one
          # ever answers again, the deploy that resurrected it should go red.
          for path in /api/ai/decision /api/parse-receipt; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://marreddy-cashflow.web.app$path")
            echo "  $path -> $CODE (expect 404)"
            [ "$CODE" = "404" ] || FAILED=1
          done
          # Every exported callable must exist (404 = not deployed) AND refuse a caller
          # who is not signed in (anything but 401 = an auth check went missing). Read
          # from index.ts so a new callable is covered the day it is exported.
          CALLABLES=$(grep -oE 'export \{[^}]+\}' functions/src/index.ts | sed -E 's/export \{|\}|,/ /g')
          # An index.ts rewritten to another export style must not turn this into zero checks and a PASS.
          if [ -z "$(echo $CALLABLES)" ]; then
            echo "::error::Found no callables in functions/src/index.ts (expected 'export { name } from'). Update this parser."
            FAILED=1
          fi
          for fn in $CALLABLES; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST -H 'Content-Type: application/json' -d '{"data":{}}' "https://us-central1-marreddy-cashflow.cloudfunctions.net/$fn")
            echo "  callable $fn -> $CODE (expect 401)"
            [ "$CODE" = "401" ] || FAILED=1
          done
          if [ "$FAILED" != "0" ]; then
            echo "::error::Live smoke test failed. Roll back with: npx firebase-tools hosting:rollback"
            exit 1
          fi
          echo "live smoke test: PASS"
