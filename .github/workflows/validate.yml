# Non-deploying validation pipeline (OPS-CI-001).
#
# This workflow VALIDATES. It never deploys, never reads a repository secret, never
# touches the production Firebase project, and never triggers SimpleFIN. Every step
# below runs against source, fixtures, or stdlib-only Python — nothing personal.
#
# See docs/ci/VALIDATION-PIPELINE.md for what is covered, what is deliberately
# excluded, and why.
name: validate

# pull_request + workflow_dispatch ONLY.
# Deliberately NOT on push, NOT on tags, NOT on release — deployment stays manual
# and local via `npm run deploy` (scripts/predeploy.sh + firebase deploy).
on:
  pull_request:
  workflow_dispatch:

# Least privilege: the job reads the checkout and nothing else. No `secrets` context
# is referenced anywhere in this file.
permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # functions/package.json declares engines.node = 20; match the deployed runtime.
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---------------------------------------------------------------------
      # 1. Dependencies
      # ---------------------------------------------------------------------
      - name: Install web dependencies
        run: npm ci

      - name: Install Firebase Functions dependencies
        run: npm ci --prefix functions

      # functions-sync/requirements.txt is deliberately NOT installed. It pins the
      # Cloud Function RUNTIME deps (firebase-admin, firebase-functions, monarchmoney)
      # which only main.py imports; main.py cannot be tested without production
      # Firebase and is excluded from this pipeline. The test modules import stdlib
      # plus sync_core/simplefin, which are stdlib-only. pytest is the only Python
      # dependency the suite actually needs.
      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check pytest

      # ---------------------------------------------------------------------
      # 2. Type checking
      # ---------------------------------------------------------------------
      - name: TypeScript type check
        run: npx tsc --noEmit

      # ---------------------------------------------------------------------
      # 3. Test suites — all three, not just the web one
      # ---------------------------------------------------------------------
      # test:ci excludes src/__tests__/flows.integration.test.ts, which reads the
      # gitignored transactionsbyaccount/ CSV export (real personal financial data
      # that must never reach CI). See docs/ci/VALIDATION-PIPELINE.md § Exclusions.
      - name: Web Jest tests
        run: npm run test:ci

      - name: Firebase Functions tests
        run: npm test --prefix functions

      - name: Python SimpleFIN/sync tests
        run: python -m pytest functions-sync -q

      # ---------------------------------------------------------------------
      # 4. Production build
      # ---------------------------------------------------------------------
      # No env vars: this must validate the real production artifact. The build
      # needs no .env and no Firebase credentials.
      - name: Next.js production build
        run: npm run build

      # ---------------------------------------------------------------------
      # 5. react-hooks crash scan
      # ---------------------------------------------------------------------
      # Mirrors gate 5 of scripts/predeploy.sh. Kept inline rather than shelling
      # into predeploy.sh because that script's final gate boots the app against
      # the REAL Firebase backend, which this pipeline must never do.
      # If the rule list changes here, change it in scripts/predeploy.sh too.
      - name: react-hooks crash scan
        run: |
          npx eslint src --format json > eslint-report.json 2>/dev/null || true
          HOOKS=$(node -e '
            const CRASH = ["react-hooks/rules-of-hooks", "react-hooks/set-state-in-effect"];
            const r = require("./eslint-report.json");
            const hits = r.flatMap(f => (f.messages||[])
              .filter(m => CRASH.includes(m.ruleId))
              .map(m => `${f.filePath.split("/").slice(-2).join("/")}:${m.line} ${m.ruleId}`));
            if (hits.length) { console.error(hits.join("\n")); }
            process.stdout.write(String(hits.length));
          ')
          rm -f eslint-report.json
          if [ "$HOOKS" != "0" ]; then
            echo "BLOCKED: $HOOKS react-hooks crash-class violation(s) above"
            exit 1
          fi
          echo "react-hooks crash scan: 0 violations"

      # ---------------------------------------------------------------------
      # 6. Browser observability validation — fixture-backed, no live data
      # ---------------------------------------------------------------------
      # Safe in CI because the spec drives /dev/accounts-fixture, which supplies the
      # React contexts from src/lib/obs/fixtures.ts and has no code path to Firebase.
      # The spec asserts a tripwire of zero requests to firestore.googleapis.com,
      # identitytoolkit.googleapis.com, cloudfunctions.net and bridge.simplefin.org,
      # and fails the run if any is contacted.
      # NEXT_PUBLIC_OBS_ENV=development is supplied by playwright.config.ts →
      # webServer.env, so it is not set at job level (which would contaminate the
      # production build above).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright observability spec
        run: npm run test:e2e

      # ---------------------------------------------------------------------
      # 7. Diagnostic bundle
      # ---------------------------------------------------------------------
      # Runs on success and on failure. The exporter redacts every file it writes and
      # exits non-zero if the finished bundle still matches a secret pattern — so a
      # leak fails the job instead of being uploaded. Deliberately NOT `|| true`.
      - name: Export diagnostic bundle
        if: always()
        run: |
          TRACE=$(ls test-results/observability 2>/dev/null | head -1)
          if [ -n "$TRACE" ]; then
            echo "Primary Trace ID: $TRACE"
            echo "Diagnostic Artifact: observability-accounts-${{ github.run_id }}"
            npm run diag:export -- "$TRACE"
          else
            echo "Primary Trace ID: (none — the spec produced no trace evidence)"
            echo "Diagnostic Artifact: observability-accounts-${{ github.run_id }}"
          fi

      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-accounts-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            diagnostic-bundles/
            playwright-report/
            test-results/observability/
