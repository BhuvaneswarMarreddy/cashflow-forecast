# Non-deploying validation pipeline (OPS-CI-001).
#
# This workflow VALIDATES. It never deploys, never reads a repository secret, never
# touches the production Firebase project, and never triggers SimpleFIN. Every step
# below runs against source, fixtures, or stdlib-only Python — nothing personal.
#
# See docs/ci/VALIDATION-PIPELINE.md for what is covered, what is deliberately
# excluded, and why.
name: validate

# pull_request + workflow_dispatch, plus workflow_call so deploy.yml can gate on this
# exact job rather than keeping a second copy of it that drifts.
#
# Still never deploys and still never reads a secret. `workflow_call` here does NOT
# inherit secrets — the caller passes none, so this job cannot reach production even
# when it runs as part of a deploy.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Least privilege: the job reads the checkout and nothing else. No `secrets` context
# is referenced anywhere in this file.
permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the runtime that actually serves the app: the Firebase web-frameworks
          # SSR function `ssrmarreddycashflow` runs nodejs24. functions/package.json still
          # declares engines.node = 20, so `npm ci --prefix functions` prints one
          # EBADENGINE *warning* here — it is a warning, it does not fail the install, and
          # the functions suite passes on both. Node 20 was verified working end to end
          # too; 24 is pinned because it is the version production runs.
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The Firestore emulator is a Java program and firebase-tools refuses any JDK
      # below 21. ubuntu-latest ships 17 by default, so the rules step failed here on
      # its first real run while passing locally on a JDK 26 laptop — precisely the
      # class of break this pipeline exists to catch.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ---------------------------------------------------------------------
      # 1. Dependencies
      # ---------------------------------------------------------------------
      - name: Install web dependencies
        run: npm ci

      # LOAD-BEARING, not just for the functions suite. The ROOT tsconfig's
      # `include: ["**/*.ts"]` pulls functions/src/*.ts into `npx tsc --noEmit` below, so
      # without this install the type check fails with 12 errors (TS2307 on
      # firebase-admin / firebase-functions). Keep this step BEFORE the type check.
      - name: Install Firebase Functions dependencies
        run: npm ci --prefix functions

      # functions-sync/requirements.txt is deliberately NOT installed. It pins the
      # Cloud Function RUNTIME deps (firebase-admin, firebase-functions, monarchmoney)
      # which only main.py imports; main.py cannot be tested without production
      # Firebase and is excluded from this pipeline. The test modules import stdlib
      # plus sync_core/simplefin, which are stdlib-only. pytest is the only Python
      # dependency the suite actually needs.
      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check pytest

      # ---------------------------------------------------------------------
      # 2. Type checking
      # ---------------------------------------------------------------------
      - name: TypeScript type check
        run: npx tsc --noEmit

      # ---------------------------------------------------------------------
      # 3. Test suites — all three, not just the web one
      # ---------------------------------------------------------------------
      # Full suite, no path exclusions. src/__tests__/flows.integration.test.ts reads the
      # gitignored transactionsbyaccount/ CSV export (real personal financial data that
      # must never reach CI); it now guards itself correctly — `load()` sits behind an
      # fs.existsSync ternary INSIDE the describe body, so a checkout with no CSVs
      # collects the file and skips its 7 tests instead of throwing ENOENT at collection.
      # Verified on a clean clone: 57 suites (1 skipped), 947 tests (7 skipped), 0 failed.
      # Running plain jest rather than `npm run test:ci` is deliberate: it keeps CI as the
      # thing that catches a regression in that guard. docs/ci/VALIDATION-PIPELINE.md
      # § Exclusions describes the old broken guard and is stale on this point.
      - name: Web Jest tests
        run: npx jest --ci

      - name: Firebase Functions tests
        run: npm test --prefix functions

      # firebase.json runs exactly this as the `api` codebase predeploy. It compiles under
      # functions/tsconfig.json (module commonjs, moduleResolution node), which the root
      # type check above does NOT use — root tsc reads those same files with
      # module esnext / moduleResolution bundler. A resolution break that only shows up
      # under node resolution would otherwise pass CI and fail at deploy time.
      - name: Firebase Functions tsc build
        run: npm run build --prefix functions

      - name: Python SimpleFIN/sync tests
        run: python -m pytest functions-sync -q

      # firestore.rules IS the access-control layer — the browser reads Firestore
      # directly, with no API in front of it. Runs against the emulator on project id
      # `demo-cashflow-rules`; the `demo-` prefix makes the Firebase tooling refuse a
      # real backend, so this stays offline like everything else here.
      #
      # Worth the ~30s emulator download: the live rules were found to be an OLDER
      # revision than this file, missing six collections the app writes, and nothing
      # in the pipeline could have told anyone. Java is preinstalled on ubuntu-latest.
      - name: Firestore rules tests
        run: npm run test:rules

      # ---------------------------------------------------------------------
      # 3b. Deployability — can `firebase deploy` still resolve this manifest?
      # ---------------------------------------------------------------------
      # Everything above proves the CODE is correct. None of it proves the app can
      # still SHIP, because CI installs from the lockfile (always resolvable) while
      # `firebase deploy` installs firebase-frameworks fresh and resolves peers
      # against the whole tree.
      #
      # That gap let three consecutive deploys fail while this job stayed green:
      # firebase-admin@^14 arrived in dependencies for the MCP Firestore loader, and
      # firebase-frameworks@0.11.8 peers on ^11 || ^12 || ^13. ERESOLVE, every time,
      # after a full clean validation run.
      #
      # Done in a scratch copy so nothing here can touch the real lockfile.
      # --dry-run: resolution is the whole question, installing proves nothing more.
      - name: Deploy resolvability (firebase-frameworks peers)
        run: |
          WORK="$RUNNER_TEMP/resolvecheck"
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp package.json package-lock.json "$WORK/"
          cd "$WORK"
          if ! npm install firebase-frameworks@^0.11.0 --package-lock-only --dry-run 2>&1 | tee out.txt; then
            echo "::error::A dependency in package.json conflicts with what firebase deploy installs. CI would stay green and every deploy would fail at install. See the ERESOLVE output above."
            exit 1
          fi
          if grep -q "ERESOLVE\|npm error" out.txt; then
            echo "::error::ERESOLVE against firebase-frameworks — deploy would fail at install."
            exit 1
          fi
          echo "deploy resolvability: OK"

      # ---------------------------------------------------------------------
      # 4. Production build
      # ---------------------------------------------------------------------
      # No env vars, and none are needed — re-verified on a clean clone with an empty
      # environment. The Firebase web config is hard-coded in src/lib/firebase.ts (public
      # client config, not a secret), the AI proxy routes are gone (src/app/api holds only
      # /api/diagnostics/trace), and OPENAI_API_KEY is read at REQUEST time inside the
      # Cloud Functions handlers, never at build time. So there is nothing to supply here,
      # not even a placeholder. Do NOT add env: to this step — NEXT_PUBLIC_OBS_ENV in
      # particular would stop this from validating the real production artifact.
      - name: Next.js production build
        run: npm run build

      # ---------------------------------------------------------------------
      # 5. react-hooks crash scan
      # ---------------------------------------------------------------------
      # Mirrors gate 5 of scripts/predeploy.sh. Kept inline rather than shelling
      # into predeploy.sh because that script's final gate boots the app against
      # the REAL Firebase backend, which this pipeline must never do.
      # If the rule list changes here, change it in scripts/predeploy.sh too.
      - name: react-hooks crash scan
        run: |
          npx eslint src --format json > eslint-report.json 2>/dev/null || true
          HOOKS=$(node -e '
            const CRASH = ["react-hooks/rules-of-hooks", "react-hooks/set-state-in-effect"];
            const r = require("./eslint-report.json");
            const hits = r.flatMap(f => (f.messages||[])
              .filter(m => CRASH.includes(m.ruleId))
              .map(m => `${f.filePath.split("/").slice(-2).join("/")}:${m.line} ${m.ruleId}`));
            if (hits.length) { console.error(hits.join("\n")); }
            process.stdout.write(String(hits.length));
          ')
          rm -f eslint-report.json
          if [ "$HOOKS" != "0" ]; then
            echo "BLOCKED: $HOOKS react-hooks crash-class violation(s) above"
            exit 1
          fi
          echo "react-hooks crash scan: 0 violations"

      # ---------------------------------------------------------------------
      # 6. Browser observability validation — fixture-backed, no live data
      # ---------------------------------------------------------------------
      # Safe in CI because the spec drives /dev/accounts-fixture, which supplies the
      # React contexts from src/lib/obs/fixtures.ts and has no code path to Firebase.
      # The spec asserts a tripwire of zero requests to firestore.googleapis.com,
      # identitytoolkit.googleapis.com, cloudfunctions.net and bridge.simplefin.org,
      # and fails the run if any is contacted.
      # NEXT_PUBLIC_OBS_ENV=development is supplied by playwright.config.ts →
      # webServer.env, so it is not set at job level (which would contaminate the
      # production build above).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright observability spec
        run: npm run test:e2e

      # ---------------------------------------------------------------------
      # 7. Diagnostic bundle
      # ---------------------------------------------------------------------
      # Runs on success and on failure. The exporter redacts every file it writes and
      # exits non-zero if the finished bundle still matches a secret pattern — so a
      # leak fails the job instead of being uploaded. Deliberately NOT `|| true`.
      - name: Export diagnostic bundle
        if: always()
        run: |
          TRACE=$(ls test-results/observability 2>/dev/null | head -1)
          if [ -n "$TRACE" ]; then
            echo "Primary Trace ID: $TRACE"
            echo "Diagnostic Artifact: observability-accounts-${{ github.run_id }}"
            npm run diag:export -- "$TRACE"
          else
            echo "Primary Trace ID: (none — the spec produced no trace evidence)"
            echo "Diagnostic Artifact: observability-accounts-${{ github.run_id }}"
          fi

      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-accounts-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            diagnostic-bundles/
            playwright-report/
            test-results/observability/
